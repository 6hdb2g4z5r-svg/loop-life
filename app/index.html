<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loop Life">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Loop Life</title>
<style>
:root{--bg:#0c1117;--card:#1b232d;--fg:#eef2f6;--mute:#8e9aa8;--line:#2a333e;--a1:#67d3c4;--a2:#2b97f5;--bad:#ff4d5e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--a1),var(--a2),var(--a1));-webkit-mask:radial-gradient(circle,transparent 31px,#000 32px);mask:radial-gradient(circle,transparent 31px,#000 32px)}
.spin{animation:r 1.1s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
.msg{margin-top:18px;color:var(--mute);font-size:14px;text-align:center;max-width:320px}
form{width:100%;max-width:440px}
h1{font-size:26px;margin:18px 0 4px;letter-spacing:-.01em}
p.sub{color:var(--mute);margin:0 0 22px;font-size:14px}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--a2)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--mute);font-size:14px;padding:8px 0}
.hint{font-size:12px;color:var(--mute);margin-top:5px}
.row{display:flex;gap:10px;margin-top:24px}
button{flex:1;padding:14px;border:0;border-radius:12px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer}
.pri{background:linear-gradient(135deg,var(--a1),var(--a2));color:#06121c}
.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.status{min-height:20px;margin-top:14px;font-size:14px;color:var(--mute)}
.status.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap" id="boot"><div class="ring spin"></div><div class="msg" id="bootmsg">Chargement…</div></div>
<script>
(function () {
  'use strict';
  var CK = 'll_cfg', DATA_CACHE = 'll-data-v1';
  var $ = function (id) { return document.getElementById(id); };
  function cfg() { try { return JSON.parse(localStorage.getItem(CK) || '{}'); } catch (e) { return {}; } }
  function url(c, params) { var q = new URLSearchParams(Object.assign({ key: c.receiverKey }, params)); return c.receiverUrl + (c.receiverUrl.indexOf('?') < 0 ? '?' : '&') + q; }
  function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]); }
  function fetchText(u) { return withTimeout(fetch(u, { cache: 'no-store' }), 60000).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }); }
  function receiverErr(t) { if (t.length < 200 && t.trim()[0] === '{') { try { var j = JSON.parse(t); if (j.ok === false) return j.error || 'erreur'; } catch (e) {} } return null; }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function putCache(name, text) { if (!window.caches) return Promise.resolve(); return caches.open(DATA_CACHE).then(function (c) { return c.put('/__ll/' + name, new Response(text, { headers: { 'content-type': 'text/plain' } })); }).catch(function () {}); }
  function getCache(name) { if (!window.caches) return Promise.resolve(null); return caches.open(DATA_CACHE).then(function (c) { return c.match('/__ll/' + name); }).then(function (r) { return r ? r.text() : null; }).catch(function () { return null; }); }

  function remote(c) {
    return Promise.all([fetchText(url(c, { action: 'state', name: 'template' })), fetchText(url(c, { action: 'state', name: 'dash' }))]).then(function (x) {
      var e = receiverErr(x[0]) || receiverErr(x[1]);
      if (e) throw new Error('Receiver : ' + e);
      if (x[0].indexOf('/*DATA*/') < 0) throw new Error('Modèle du tableau de bord invalide');
      JSON.parse(x[1]);
      return Promise.all([putCache('template', x[0]), putCache('dash', x[1])]).then(function () { return { t: x[0], d: x[1], fresh: true }; });
    });
  }
  function cached() { return Promise.all([getCache('template'), getCache('dash')]).then(function (x) { if (!x[0] || !x[1]) throw new Error('no cache'); return { t: x[0], d: x[1], fresh: false }; }); }

  function render(pack) {
    return fetch('shim.js').then(function (r) { return r.text(); }).then(function (shim) {
      var gear = '<button id="ll-gear" aria-label="Réglages" onclick="localStorage.setItem(\'ll_setup\',\'1\');location.reload()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>';
      var head = '<script>' + shim.replace(/<\/script/gi, '<\\/script') + '<\/script>';
      var html = pack.t.replace('/*DATA*/', function () { return pack.d; });
      var i = html.search(/<script[\s>]/i);
      html = i < 0 ? head + html : html.slice(0, i) + head + html.slice(i);
      // keep the PWA metas so iOS treats the rendered page as the standalone app
      var metas = '<meta name="theme-color" content="#0c1117"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">';
      html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + metas; }) : metas + html;
      // iPhone app layout fixes: opaque header pinned under the status bar, tab bar lowered and backed so no text shows beneath it
      var NB = 'max(6px,calc(env(safe-area-inset-bottom,0px) - 14px))';
      var fix = '<style id="ll-pwa-fix">' +
        '.top{position:relative!important;top:auto!important;z-index:5!important;padding-top:10px!important}' +
        'body:before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--top);z-index:50;pointer-events:none}' +
        '.who{gap:6px!important}.top{gap:6px}.datenav .d{min-width:0!important;padding:5px 9px!important}.datenav button{width:24px!important}.topr{gap:6px!important}.syncb{padding:5px 8px!important}' +
        '#ll-gear{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mute);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}' +
        '.nav{z-index:30!important;padding-bottom:' + NB + '!important;background:linear-gradient(to bottom,transparent 0,var(--bg) 26px)!important}' +
        '.nav .in{background:var(--card)!important;backdrop-filter:none!important}' +
        '.cbub{bottom:calc(' + NB + ' + 82px + var(--lift))!important;width:56px!important;height:56px!important;border-radius:18px!important}' +
        '.app{padding-bottom:calc(96px + var(--lift))!important}' +
        '</style>';
      var placed = false;
      html = html.replace(/(<div class="who">[\s\S]*?<\/button>)/, function (m) { placed = true; return m + gear; });
      var tail = fix + (placed ? '' : gear.replace('<button id="ll-gear"', '<button id="ll-gear" style="position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:40"'));
      html = /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, tail + '</body>') : html + tail;
      document.open(); document.write(html); document.close();
    });
  }

  function showError(msg) {
    $('boot').innerHTML = '<div class="ring"></div><div class="msg" style="color:#ff8a95">' + msg.replace(/</g, '&lt;') + '</div><div class="row" style="width:100%;max-width:360px"><button class="sec" id="b-set">Réglages</button><button class="pri" id="b-retry">Réessayer</button></div>';
    $('b-retry').onclick = function () { location.reload(); };
    $('b-set').onclick = function () { localStorage.setItem('ll_setup', '1'); location.reload(); };
  }

  function setup(c, note) {
    document.body.innerHTML =
      '<div class="wrap"><form id="f" autocomplete="off"><div class="ring"></div><h1>Loop Life</h1><p class="sub">Réglages enregistrés uniquement sur cet appareil.</p>' +
      '<label>URL du receiver</label><input id="u" type="url" required placeholder="https://script.google.com/macros/s/…/exec">' +
      '<label>Clé du receiver</label><input id="k" type="password" required>' +
      '<label>Clé API Claude <span style="text-transform:none;letter-spacing:0">(coach IA, optionnel)</span></label><input id="a" type="password" placeholder="sk-ant-…"><div class="hint">Fixe une limite de dépense mensuelle dans la Claude Console.</div>' +
      '<details><summary>Avancé</summary>' +
      '<label>Jeton GitHub <span style="text-transform:none;letter-spacing:0">(Synchro instantanée, optionnel)</span></label><input id="g" type="password" placeholder="github_pat_…"><div class="hint">Jeton fine-grained limité au dépôt, permission « Actions : read and write ».</div>' +
      '<label>Dépôt GitHub</label><input id="r" placeholder="propriétaire/loop-life">' +
      '<label>Modèle rapide</label><input id="m1"><label>Modèle par défaut</label><input id="m2"><label>Modèle complexe</label><input id="m3">' +
      '</details>' +
      '<div class="notif"><label>Notifications</label><button type="button" class="sec" id="nbtn" style="width:100%">Activer les notifications</button><div class="hint" id="nst"></div></div>' +
      '<div class="status" id="st"></div><div class="row">' + (c.receiverUrl ? '<button type="button" class="sec" id="cancel">Annuler</button>' : '') + '<button class="pri" type="submit">Enregistrer</button></div></form></div>';
    var m = c.models || {};
    $('u').value = c.receiverUrl || ''; $('k').value = c.receiverKey || ''; $('a').value = c.anthropicKey || ''; $('g').value = c.ghToken || '';
    $('r').value = c.ghRepo || DEFAULT_REPO; $('m1').value = m.quick || 'claude-haiku-5-5'; $('m2').value = m.default || 'claude-sonnet-5-5'; $('m3').value = m.complex || 'claude-opus-5-5';
    if (note) { $('st').textContent = note; $('st').className = 'status bad'; }
    setupNotif(c);
    if ($('cancel')) $('cancel').onclick = function () { localStorage.removeItem('ll_setup'); location.reload(); };
    $('f').onsubmit = function (ev) {
      ev.preventDefault();
      var n = { receiverUrl: $('u').value.trim(), receiverKey: $('k').value.trim(), anthropicKey: $('a').value.trim(), ghToken: $('g').value.trim(), ghRepo: $('r').value.trim(),
        models: { quick: $('m1').value.trim(), default: $('m2').value.trim(), complex: $('m3').value.trim() } };
      $('st').className = 'status'; $('st').textContent = 'Vérification…';
      fetchText(url(n, { action: 'state', name: 'dash' })).then(function (t) {
        var e = receiverErr(t); if (e === 'bad key') throw new Error('Clé du receiver incorrecte');
        if (e && e !== 'missing') throw new Error('Receiver : ' + e);
        localStorage.setItem(CK, JSON.stringify(n)); localStorage.removeItem('ll_setup'); location.reload();
      }).catch(function (e) { $('st').className = 'status bad'; $('st').textContent = e.message === 'timeout' ? 'Receiver injoignable' : e.message; });
    };
  }

  function b64uToBytes(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function postJSON(c, name, obj) { return fetch(url(c, { store: name }), { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(obj) }).then(function (r) { return r.json(); }); }
  function setupNotif(c) {
    var b = $('nbtn'), st = $('nst');
    var standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    function say(t) { st.textContent = t; }
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      b.disabled = true;
      say(standalone ? 'Notifications non disponibles sur cet appareil (iOS 16.4 minimum).' : 'Ajoute d’abord Loop Life à l’écran d’accueil (Safari → Partager → Sur l’écran d’accueil), puis ouvre-la depuis l’icône.');
      return;
    }
    navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (sub && Notification.permission === 'granted') { b.textContent = 'Notifications activées ✓ (réactiver)'; say('Cet appareil reçoit les notifications Loop Life.'); }
    }).catch(function () {});
    b.onclick = function () {
      if (!c.receiverUrl || !c.receiverKey) { say('Enregistre d’abord l’URL et la clé du receiver.'); return; }
      say('Demande d’autorisation…');
      Notification.requestPermission().then(function (p) {
        if (p !== 'granted') throw new Error('Autorisation refusée. Réactive-la dans Réglages → Notifications → Loop Life.');
        return Promise.all([navigator.serviceWorker.ready, fetchText(url(c, { action: 'state', name: 'vapid_pub' }))]);
      }).then(function (x) {
        var k; try { k = JSON.parse(x[1]).key; } catch (e) {}
        if (!k) throw new Error('Clé de notification pas encore créée : lance une synchro puis réessaie.');
        return x[0].pushManager.getSubscription().then(function (old) { return old ? old.unsubscribe() : null; })
          .then(function () { return x[0].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(k) }); });
      }).then(function (sub) {
        var j = sub.toJSON();
        return fetchText(url(c, { action: 'state', name: 'push_subs' })).then(function (t) {
          var cur = { subs: {} }; try { var p = JSON.parse(t); if (p && p.subs) cur = p; } catch (e) {}
          cur.subs[j.endpoint] = { endpoint: j.endpoint, keys: j.keys, added: new Date().toISOString(), ua: navigator.userAgent.slice(0, 80) };
          return postJSON(c, 'push_subs', cur);
        });
      }).then(function (r) {
        if (!r || !r.ok) throw new Error('Enregistrement impossible sur le receiver.');
        b.textContent = 'Notifications activées ✓ (réactiver)';
        say('C’est bon. Les prochaines alertes Loop Life arriveront ici (Telegram s’arrête automatiquement).');
      }).catch(function (e) { say(e.message || String(e)); });
    };
  }

  var DEFAULT_REPO = (function () { var h = location.hostname, p = location.pathname.split('/').filter(Boolean)[0]; return /\.github\.io$/.test(h) && p ? h.split('.')[0] + '/' + p : ''; })();
  var c = cfg();
  if (!c.receiverUrl || !c.receiverKey || localStorage.getItem('ll_setup')) { setup(c); return; }
  $('bootmsg').textContent = 'Synchronisation…';
  // instant start from the last copy when we have one; fetch fresh in the background
  cached().then(function (pack) {
    render(pack);   // shim.js then checks the receiver and reloads if newer
  }, function () {
    return remote(c).then(render).catch(function (e) {
      if (/bad key/.test(e.message)) return setup(c, 'Clé du receiver refusée.');
      showError(e.message === 'timeout' ? 'Receiver injoignable. Vérifie ta connexion.' : e.message);
    });
  });
})();
</script>
</body>
</html>
