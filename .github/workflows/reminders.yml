name: reminders
on:
  schedule:
    - cron: '12 10,13,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | morning | midday | session | strain | bedtime'
        default: auto
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Fonts and Pillow
        run: |
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core >/dev/null || true
          pip install -q pillow pywebpush
      - name: Check pipeline scripts
        id: chk
        run: |
          for f in tg_cards.py tg_remind.py dayplan.js; do
            [ -f pipeline/scripts/$f ] || { echo "missing pipeline/scripts/$f"; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; }
          done
          echo "ok=1" >> $GITHUB_OUTPUT
      - name: Reminder
        if: steps.chk.outputs.ok == '1'
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_KEY: ${{ secrets.RECEIVER_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          REMIND_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: bash pipeline/remind.sh
